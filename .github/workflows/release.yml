name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: amd64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Keep CI tooling aligned with the Nucleus Gradle plugin declared in
      # gradle/libs.versions.toml. setup-nucleus only prepares the build host;
      # it has no bearing on which files are published.
      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.4.7
        with:
          java-version: '25'
          packaging-tools: 'true'
          flatpak: 'true'
          snap: 'true'

      - name: Build release packages
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS \
            -PappVersion="$VERSION" \
            --stacktrace --no-daemon

      - name: Stage publishable release assets
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/stage-release-assets.sh \
            composeApp/build/compose/binaries/main-release \
            release-assets

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: release-assets/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: false
          path: release-assets

      - name: Resolve release channel
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL=latest
          RELEASE_TYPE=release
          if [[ "$VERSION" == *-alpha.* ]]; then
            CHANNEL=alpha
            RELEASE_TYPE=prerelease
          elif [[ "$VERSION" == *-beta.* ]]; then
            CHANNEL=beta
            RELEASE_TYPE=prerelease
          fi
          {
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_CHANNEL=$CHANNEL"
            echo "RELEASE_TYPE=$RELEASE_TYPE"
          } >> "$GITHUB_ENV"

      # Nucleus's publish-release action uses `gh release upload --clobber`.
      # That replaces matching names but does not remove assets uploaded by an
      # earlier, incorrect run of the same tag. Prune first so reruns are
      # idempotent and the staged artifact boundary below is authoritative.
      - name: Remove stale assets from existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet; no stale assets to remove."
            exit 0
          fi

          mapfile -t ASSET_NAMES < <(
            gh release view "$TAG" --json assets --jq '.assets[].name'
          )
          if [ "${#ASSET_NAMES[@]}" -eq 0 ]; then
            echo "Release $TAG has no existing assets."
            exit 0
          fi

          printf 'Removing %d stale asset(s) from release %s.\n' \
            "${#ASSET_NAMES[@]}" "$TAG"
          for asset_name in "${ASSET_NAMES[@]}"; do
            gh release delete-asset "$TAG" "$asset_name" --yes
          done

      - name: Generate Nucleus update feeds
        uses: ./.github/actions/generate-update-yml
        with:
          artifacts-path: release-assets
          version: ${{ env.RELEASE_VERSION }}
          channel: ${{ env.RELEASE_CHANNEL }}

      - name: Publish release and update feeds
        uses: NucleusFramework/Nucleus/.github/actions/publish-release@v2.4.7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          artifacts-path: release-assets
          tag: ${{ github.ref_name }}
          release-type: ${{ env.RELEASE_TYPE }}
