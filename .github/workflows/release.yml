name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: amd64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.4.7
        with:
          java-version: '25'
          packaging-tools: 'true'
          flatpak: 'true'
          snap: 'true'

      - name: Build release packages
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS \
            -PappVersion="$VERSION" \
            --stacktrace --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: composeApp/build/compose/binaries/main-release/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: false
          path: release-assets

      - name: Resolve release channel
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL=latest
          RELEASE_TYPE=release
          if [[ "$VERSION" == *-alpha.* ]]; then
            CHANNEL=alpha
            RELEASE_TYPE=prerelease
          elif [[ "$VERSION" == *-beta.* ]]; then
            CHANNEL=beta
            RELEASE_TYPE=prerelease
          fi
          {
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_CHANNEL=$CHANNEL"
            echo "RELEASE_TYPE=$RELEASE_TYPE"
          } >> "$GITHUB_ENV"

      - name: Generate Nucleus update feeds
        uses: ./.github/actions/generate-update-yml
        with:
          artifacts-path: release-assets
          version: ${{ env.RELEASE_VERSION }}
          channel: ${{ env.RELEASE_CHANNEL }}

      - name: Publish release and update feeds
        uses: NucleusFramework/Nucleus/.github/actions/publish-release@v2.4.7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          artifacts-path: release-assets
          tag: ${{ github.ref_name }}
          release-type: ${{ env.RELEASE_TYPE }}
